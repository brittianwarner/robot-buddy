# cargo-deny policy: `cargo deny --locked --all-features check` (`bun run deny`; CI runs
# the same arguments on every push).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The workspace ships to macOS/Linux servers and the Raspberry Pi 5 robot.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates are reported, not fatal: most arrive through rivetkit/rig.
unmaintained = "workspace"
yanked = "deny"
# Each ignore names its reason. Revisit when the dependency moves.
ignore = [
  # Bundled SQLite in libsqlite3-sys 0.35 arrives only through the rusqlite
  # dev-dependency (crates/buddy/tests); it opens databases the test wrote itself.
  { id = "RUSTSEC-2026-0459", reason = "dev-dependency only; test-written databases" },
  # chrono and chrono-tz are direct dependencies of crates/buddy (context.rs time and
  # zones). Replacing them (jiff) is a source change, tracked separately.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, not vulnerable; migration to jiff pending" },
  { id = "RUSTSEC-2026-0555", reason = "unmaintained, not vulnerable; migration to jiff pending" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Every license some dependency currently needs. A new license fails CI until reviewed.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
# Two major versions of one crate are worth knowing about, not worth failing CI over.
# The duplicates in the lockfile today, and why each stays (checked with
# `cargo tree --locked --all-features -i <crate>`):
#   - reqwest 0.12 and 0.13: rivetkit 3.1.1 (rivetkit-core, rivetkit-client,
#     opentelemetry-otlp) needs 0.12, rig 0.46 (rig-reqwest) needs 0.13. Our own
#     reqwest is 0.12, so moving it would not remove either.
#   - axum 0.7 and 0.8: 0.7 comes from tonic 0.12 under opentelemetry-otlp's grpc-tonic
#     feature, which rivetkit-core's default native-runtime turns on with no opt-out.
#   - ring and aws-lc-rs: ring through rustls in reqwest 0.12 and tokio-tungstenite
#     (rivetkit); aws-lc-rs through rig's reqwest 0.13 `rustls` default provider and
#     jsonwebtoken's `aws_lc_rs` backend (its `rust_crypto` backend pulls the `rsa` crate,
#     RUSTSEC-2023-0071). The robot binary links ring only; aws-lc-rs is server-side.
multiple-versions = "warn"
# Workspace crates use path dependencies without versions. They are all
# `publish = false` (workspace.package), which is what allow-wildcard-paths needs, so any
# other wildcard fails.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
