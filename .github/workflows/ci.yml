name: Rust
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check && bun run check && bun run lint && bun run test
      # Owns an isolated engine on BUDDY_TEST_ENGINE_PORT (+1, +10) and a mock model on
      # BUDDY_TEST_MODEL_PORT, and fails if anything still listens afterwards.
      - run: bun run test:integration
      - run: cargo build --release --workspace --locked
      # Uses the release binaries above: the robot must stop on SIGTERM/SIGINT within
      # 500 ms with stdin still open, and write its cache on the way out.
      - run: bun run test:shutdown
      - run: cargo bench --workspace --locked --no-run
      # Deterministic and offline: a local Bun server feeds PCM to the lab voice player.
      - run: bunx playwright install --with-deps chromium
      - run: bun tests/early-player.mjs

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked --all-features

  robot-aarch64:
    # The robot runs on a Raspberry Pi 5. Build scripts (ring, aws-lc-sys) need a C
    # cross compiler even for `cargo check`.
    runs-on: ubuntu-latest
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: cargo check --locked --target aarch64-unknown-linux-gnu -p robot-buddy-robot
