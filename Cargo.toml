[workspace]
members = ["crates/buddy", "apps/server", "apps/robot"]
resolver = "3"
[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["form"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rivetkit = "=3.1.1"
# Public typed action errors (`user/busy`); already in the tree through rivetkit-core.
rivet-error = "=3.1.1"
# The client alone: the robot talks to actors without linking the actor runtime.
rivetkit-client = "=3.1.1"
rig = { version = "=0.46.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }
url = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Errors and panics are documented where they are not obvious from the signature.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.dev]
debug = 0
[profile.release]
lto = "thin"
strip = true
