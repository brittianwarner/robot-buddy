[package]
name = "robot-buddy-robot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[features]
pi-vision = ["dep:opencv"]

[dependencies]
base64.workspace = true
opencv = { version = "=0.102.0", optional = true, default-features = false, features = ["clang-runtime", "dnn", "imgproc", "imgcodecs", "objdetect"] }
# Contracts and device credentials only; the robot never links the actor runtime.
robot-buddy = { path = "../../crates/buddy", default-features = false }
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["http2"] }
rivetkit-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true
qrcode.workspace = true
# Safe termios for the ESP32 serial line (raw 115200, CLOCAL, no HUPCL) and ptys in
# tests; umask, chown and group lookup for the control socket. Already in the
# lockfile through rivetkit-core; adds no new crates.
nix = { version = "0.30.1", default-features = false, features = ["fs", "term", "user"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
