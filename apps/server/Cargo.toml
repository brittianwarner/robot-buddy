[package]
name = "robot-buddy-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
robot-buddy = { path = "../../crates/buddy" }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
rand.workspace = true
# HTTP/2 lets lookahead synthesis share one provider connection.
reqwest = { workspace = true, features = ["http2"] }
rivetkit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
qrcode.workspace = true

hmac.workspace = true
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
