# Optional Pi 5 hardware profile. Install as
# /etc/systemd/system/robot-buddy.service.d/20-pip.conf.
# libcamera needs the Pi's video/media nodes. Keep all base unit hardening.
[Service]
SupplementaryGroups=video
# Starting budgets for local speech + vision, not measured guarantees.
# These include the Rust process AND all capture, recognition and TTS children.
MemoryMax=1G
TasksMax=256
Environment=OMP_NUM_THREADS=2
Environment=OPENBLAS_NUM_THREADS=1
