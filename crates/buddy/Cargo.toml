[package]
name = "robot-buddy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[bench]] targets below are benches; benches/legacy_sentences.rs is a module
# of the sentences bench, not a bench of its own.
autobenches = false

[features]
default = ["server"]
# The actors, the model harness and their runtime. The robot builds without it and keeps
# only the wire contracts, device credentials and audio formats.
server = [
    "dep:async-trait",
    "dep:chrono",
    "dep:chrono-tz",
    "dep:futures-util",
    "dep:reqwest",
    "dep:rig",
    "dep:rivet-error",
    "dep:rivetkit",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:url",
    "serde_json/raw_value",
]

[dependencies]
anyhow.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
# Strict settings writes on otherwise additive-tolerant types (protocol::strict).
serde_ignored = "0.1"
sha2.workspace = true
uuid.workspace = true
# Secret buffers are cleared on drop; compiled for the robot too.
zeroize = "1"
async-trait = { workspace = true, optional = true }
chrono = { version = "0.4", optional = true }
chrono-tz = { version = "0.10", optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rivetkit = { workspace = true, optional = true }
rivet-error = { workspace = true, optional = true }
rig = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { version = "0.7", optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true
axum.workspace = true
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[lints]
workspace = true

[[test]]
name = "actors"
required-features = ["server"]

[[test]]
name = "history_sql"
required-features = ["server"]

[[bench]]
name = "sentences"
harness = false

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "history_sql"
harness = false
required-features = ["server"]
