services:
  robot-buddy:
    build: .
    image: robot-buddy:local
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6420:6420"
    volumes:
      - buddy-data:/data
    # The engine config (admin token, S3 keys) is written here; tmpfs keeps it off disk.
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  buddy-data:
