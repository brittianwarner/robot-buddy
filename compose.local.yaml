# Local-only test workspace, isolated from the default Rivet ports.
services:
  robot-buddy:
    build: .
    image: robot-buddy:local
    env_file: .env.local
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:17420:6420"
    volumes:
      - buddy-local-data:/data
    # Only /data and /tmp are writable. The engine config (admin token, S3 keys)
    # is written to /tmp; tmpfs keeps it off disk.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Measured: server about 40 MB, engine 70-125 MB RSS (docs/research/e2e-latency.md).
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  buddy-local-data:
